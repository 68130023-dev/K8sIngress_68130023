# app-about : nginx config
# ทำให้ /about ตอบ 200 ตรง ๆ ไม่ redirect 301 แบบ default ของ nginx
server {
    listen 80;
    server_name _;
    charset utf-8;
    root /usr/share/nginx/html;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /about {
        try_files /about.html =404;
    }

    location = /about/ {
        try_files /about.html =404;
    }

    # ไฟล์รูป / css / อื่น ๆ
    location / {
        try_files $uri $uri/ /index.html;
    }
}
